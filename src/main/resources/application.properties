spring.application.name=desconfie-api

# Banco Oracle: os valores vêm SEMPRE de variáveis de ambiente.
# Nunca escreva usuário, senha ou URL real neste arquivo (vale -10 na GS).
# Local: IntelliJ > Run > Edit Configurations > Environment variables.
# Render: painel do serviço > Environment.
desconfie.db.url=${DB_URL}
desconfie.db.usuario=${DB_USER}
desconfie.db.senha=${DB_PASSWORD}

# Porta: o Render define PORT; localmente usa 8080.
server.port=${PORT:8080}
